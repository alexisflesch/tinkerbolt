<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="c7-bolt.css" />
    <title>Propositions C7 — Bolt</title>
  </head>
  <body>
    <main>
      <section class="screen home-screen" aria-label="Accueil avec Bolt">
        <img
          class="current-screen"
          src="../v1/captures/accueil-1440.png"
          alt="Maquette actuelle de l’accueil"
        />
        <figure class="bolt-tile home-bolt">
          <img src="../../../art/assets/bolt/bolt-explaining.png" alt="" />
        </figure>
      </section>

      <section class="screen victory-screen" aria-label="Victoire avec Bolt">
        <img
          class="current-screen"
          src="captures/victoire-base-1440x900.png"
          alt="Capture actuelle du plateau et de la victoire"
        />
        <article class="victory-proposal" aria-label="Proposition de dialogue de victoire">
          <header>
            <h1>BRAVO !</h1>
            <span class="close-mark" aria-hidden="true">×</span>
          </header>
          <div class="victory-content">
            <div class="tier" aria-label="Résolu">
              <span class="check-mark" aria-hidden="true">✓</span>
              <strong>Résolu</strong>
            </div>
            <div class="summary-and-bolt">
              <div class="summary">
                <strong>Résolu sans poser d’objet.</strong>
                <p>La machine a fonctionné comme prévu.</p>
              </div>
              <figure class="bolt-tile victory-bolt">
                <img src="../../../art/assets/bolt/bolt-victory.png" alt="" />
              </figure>
            </div>
            <div class="actions">
              <button class="primary">↻ &nbsp; Recommencer</button>
              <button>⤨ &nbsp; Remixer</button>
              <a>Voir la scène</a>
            </div>
          </div>
        </article>
      </section>
    </main>
    <script>
      const view = new URLSearchParams(window.location.search).get('view');
      document.body.dataset.view = view === 'victory' ? 'victory' : 'home';
    </script>
  </body>
</html>
