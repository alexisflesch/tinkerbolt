<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="c6-splash.css" />
    <title>Maquette C6 — écran de démarrage</title>
  </head>
  <body>
    <main class="splash" aria-label="Écran de démarrage TinkerBolt">
      <div class="backdrop" aria-hidden="true"></div>
      <picture class="splash-art">
        <source
          media="(min-width: 1100px)"
          srcset="../../../art/icons-splash_screen/splash-screen-desktop.png"
        />
        <source
          media="(min-width: 600px)"
          srcset="../../../art/icons-splash_screen/splash-screen-tablet.png"
        />
        <img
          src="../../../art/icons-splash_screen/splash-screen.png"
          alt="TinkerBolt — Bolt prépare une machine dans son atelier."
        />
      </picture>
      <section class="loading" aria-label="Chargement de TinkerBolt">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Chargement"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="68"
        >
          <span></span>
        </div>
        <div class="credit">Créé par Alexis Flesch</div>
      </section>
    </main>
  </body>
</html>
