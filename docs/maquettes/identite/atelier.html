<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maquette — identité visuelle, atelier</title>
    <link rel="stylesheet" href="identite.css" />
    <link rel="stylesheet" href="atelier.css" />
  </head>
  <body class="atelier">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-house" viewBox="0 0 24 24">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
        <path
          d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
        />
      </symbol>
      <symbol id="i-map" viewBox="0 0 24 24">
        <path
          d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"
        />
        <path d="M15 5.764v15" />
        <path d="M9 3.236v15" />
      </symbol>
      <symbol id="i-wrench" viewBox="0 0 24 24">
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"
        />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect width="7" height="7" x="3" y="3" rx="1" />
        <rect width="7" height="7" x="14" y="3" rx="1" />
        <rect width="7" height="7" x="14" y="14" rx="1" />
        <rect width="7" height="7" x="3" y="14" rx="1" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path
          d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
        />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path
          d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
        />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path
          d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
        />
        <path d="m15 5 4 4" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-undo-2" viewBox="0 0 24 24">
        <path d="M9 14 4 9l5-5" />
        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
      </symbol>
      <symbol id="i-redo-2" viewBox="0 0 24 24">
        <path d="m15 14 5-5-5-5" />
        <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" />
      </symbol>
      <symbol id="i-rotate-ccw" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </symbol>
      <symbol id="i-zoom-in" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" x2="16.65" y1="21" y2="16.65" />
        <line x1="11" x2="11" y1="8" y2="14" />
        <line x1="8" x2="14" y1="11" y2="11" />
      </symbol>
      <symbol id="i-zoom-out" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" x2="16.65" y1="21" y2="16.65" />
        <line x1="8" x2="14" y1="11" y2="11" />
      </symbol>
      <symbol id="i-maximize-2" viewBox="0 0 24 24">
        <path d="M15 3h6v6" />
        <path d="m21 3-7 7" />
        <path d="m3 21 7-7" />
        <path d="M9 21H3v-6" />
      </symbol>
      <symbol id="i-gamepad-2" viewBox="0 0 24 24">
        <line x1="6" x2="10" y1="11" y2="11" />
        <line x1="8" x2="8" y1="9" y2="13" />
        <line x1="15" x2="15.01" y1="12" y2="12" />
        <line x1="18" x2="18.01" y1="10" y2="10" />
        <path
          d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
        />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 3v12" />
        <path d="m17 8-5-5-5 5" />
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      </symbol>
      <symbol id="i-circle-question-mark" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
        <path d="M12 17h.01" />
      </symbol>
      MISSING trash-2
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M12 17v5" />
        <path
          d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
        />
      </symbol>
      <symbol id="i-power" viewBox="0 0 24 24">
        <path d="M12 2v10" />
        <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </symbol>
      <symbol id="i-cable" viewBox="0 0 24 24">
        <path d="M17 19a1 1 0 0 1-1-1v-2a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a1 1 0 0 1-1 1z" />
        <path d="M17 21v-2" />
        <path d="M19 14V6.5a1 1 0 0 0-7 0v11a1 1 0 0 1-7 0V10" />
        <path d="M21 21v-2" />
        <path d="M3 5V3" />
        <path d="M4 10a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a2 2 0 0 1-2 2z" />
        <path d="M7 5V3" />
      </symbol>
      <symbol id="i-hand" viewBox="0 0 24 24">
        <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
        <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
        <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
        <path
          d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"
        />
      </symbol>
      <symbol id="i-trash-2" viewBox="0 0 24 24">
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M3 6h18" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </symbol>
    </svg>

    <header class="top">
      <div class="wrap">
        <a class="logo" href="accueil.html"><img src="img/logo.webp" alt="TinkerBolt" /></a>
        <nav class="nav" aria-label="Navigation principale">
          <a href="accueil.html"
            ><svg class="icon"><use href="#i-house" /></svg>Accueil</a
          >
          <a href="#"
            ><svg class="icon"><use href="#i-map" /></svg>Campagne</a
          >
          <a href="#" aria-current="page"
            ><svg class="icon"><use href="#i-wrench" /></svg>Atelier</a
          >
          <a href="#"
            ><svg class="icon"><use href="#i-grid" /></svg>Mes niveaux</a
          >
        </nav>
        <a class="top-tool" href="#" aria-label="Paramètres"
          ><svg class="icon"><use href="#i-settings" /></svg
        ></a>
      </div>
    </header>

    <main class="bench">
      <aside class="catalogue" aria-label="Catalogue d’objets">
        <h2>Catalogue <small>15 objets</small></h2>
        <div class="catalogue-scroll">
          <h3>Ce qui bouge</h3>
          <div class="tiles">
            <button class="tile" type="button" title="Roule, tombe et rebondit">
              <span class="tile-art"><img src="img/thumbs/ball.png" alt="" /></span
              ><span class="tile-name">Balle</span>
            </button>
            <button class="tile" type="button" title="La cible finale de la scène">
              <span class="tile-art"><img src="img/thumbs/basket.png" alt="" /></span
              ><span class="tile-name">Panier</span>
            </button>
            <button
              class="tile"
              type="button"
              title="Un poids de 10 kg pour appuyer ou faire basculer"
            >
              <span class="tile-art"><img src="img/thumbs/mass.png" alt="" /></span
              ><span class="tile-name">Masse</span>
            </button>
            <button class="tile" type="button" title="Une caisse à pousser ou à transporter">
              <span class="tile-art"><img src="img/thumbs/box-wood.png" alt="" /></span
              ><span class="tile-name">Caisse en bois</span>
            </button>
            <button class="tile" type="button" title="Une caisse que l’électroaimant attire">
              <span class="tile-art"><img src="img/thumbs/box-metal.png" alt="" /></span
              ><span class="tile-name">Caisse métallique</span>
            </button>
          </div>
          <h3>Structures</h3>
          <div class="tiles">
            <button class="tile" type="button" title="Un support fixe, en trois longueurs">
              <span class="tile-art"><img src="img/thumbs/beam.png" alt="" /></span
              ><span class="tile-name">Poutre</span>
            </button>
            <button class="tile" type="button" title="Une planche qui pivote sous le poids">
              <span class="tile-art"><img src="img/thumbs/seesaw.png" alt="" /></span
              ><span class="tile-name">Bascule</span>
            </button>
            <button class="tile" type="button" title="Fait rebondir ce qui tombe dessus">
              <span class="tile-art"><img src="img/thumbs/springboard.png" alt="" /></span
              ><span class="tile-name">Tremplin</span>
            </button>
          </div>
          <h3>Appareils</h3>
          <div class="tiles">
            <button
              class="tile"
              type="button"
              title="Un tapis roulant, vers la gauche ou la droite"
            >
              <span class="tile-art"><img src="img/thumbs/conveyor.png" alt="" /></span
              ><span class="tile-name">Convoyeur</span>
            </button>
            <button class="tile" type="button" title="Souffle devant lui quand il est en marche">
              <span class="tile-art"><img src="img/thumbs/fan.png" alt="" /></span
              ><span class="tile-name">Ventilateur</span>
            </button>
            <button
              class="tile"
              type="button"
              title="Attire les caisses métalliques quand il est en marche"
            >
              <span class="tile-art"><img src="img/thumbs/electro-magnet.png" alt="" /></span
              ><span class="tile-name">Électroaimant</span>
            </button>
            <button class="tile" type="button" title="Pousse d’un coup ce qui est devant lui">
              <span class="tile-art"><img src="img/thumbs/piston.png" alt="" /></span
              ><span class="tile-name">Piston</span>
            </button>
            <button
              class="tile"
              type="button"
              title="Une barre qui s’ouvre ou se ferme sur commande"
            >
              <span class="tile-art"><img src="img/thumbs/barrier.png" alt="" /></span
              ><span class="tile-name">Barrière</span>
            </button>
          </div>
          <h3>Commandes</h3>
          <div class="tiles">
            <button class="tile" type="button" title="Trois positions pour commander un appareil">
              <span class="tile-art"><img src="img/thumbs/lever.png" alt="" /></span
              ><span class="tile-name">Levier</span>
            </button>
            <button class="tile" type="button" title="Actif tant qu’un objet appuie dessus">
              <span class="tile-art"><img src="img/thumbs/button.png" alt="" /></span
              ><span class="tile-name">Bouton</span>
            </button>
            <button class="tile" type="button" title="Retarde le signal de quelques secondes">
              <span class="tile-art"><img src="img/thumbs/timer.png" alt="" /></span
              ><span class="tile-name">Minuteur</span>
            </button>
            <button class="tile" type="button" title="Relie une commande à un appareil">
              <span class="tile-art"
                ><svg class="icon wire-icon"><use href="#i-cable" /></svg></span
              ><span class="tile-name">Fil</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="work">
        <div class="toolbar" role="toolbar" aria-label="Commandes de l’atelier">
          <div class="tool-group">
            <button class="tool" type="button" aria-label="Annuler" title="Annuler">
              <svg class="icon"><use href="#i-undo-2" /></svg>
            </button>
            <button class="tool" type="button" aria-label="Rétablir" title="Rétablir" disabled>
              <svg class="icon"><use href="#i-redo-2" /></svg>
            </button>
            <button
              class="tool"
              type="button"
              aria-label="Remettre l’atelier à zéro"
              title="Remettre l’atelier à zéro"
            >
              <svg class="icon"><use href="#i-rotate-ccw" /></svg>
            </button>
          </div>
          <div class="tool-group">
            <button class="tool" type="button" aria-label="Zoom arrière" title="Zoom arrière">
              <svg class="icon"><use href="#i-zoom-out" /></svg>
            </button>
            <button class="tool" type="button" aria-label="Zoom avant" title="Zoom avant">
              <svg class="icon"><use href="#i-zoom-in" /></svg>
            </button>
            <button
              class="tool"
              type="button"
              aria-label="Ajuster à la scène"
              title="Ajuster à la scène"
            >
              <svg class="icon"><use href="#i-maximize-2" /></svg>
            </button>
          </div>
          <p class="level-name">
            <strong>Nouveau niveau</strong><svg class="icon"><use href="#i-pencil" /></svg>
          </p>
          <div class="tool-group tool-group-plain">
            <button class="tool tool-text" type="button">
              <svg class="icon"><use href="#i-gamepad-2" /></svg><span>Essayer en joueur</span>
            </button>
            <button class="tool tool-text" type="button">
              <svg class="icon"><use href="#i-upload" /></svg><span>Exporter</span>
            </button>
            <button class="tool tool-text" type="button">
              <svg class="icon"><use href="#i-circle-question-mark" /></svg><span>Objectif</span>
            </button>
          </div>
          <button class="launch" type="button">
            <svg class="icon"><use href="#i-play" /></svg><span>Lancer</span>
          </button>
        </div>

        <div class="canvas">
          <div class="scene">
            <img src="img/scene.webp" alt="Plateau de l’atelier" />

            <!-- État « objet » : le ventilateur est sélectionné. -->
            <div
              class="selection only-objet"
              style="--x: 5.93; --y: 6.9; --w: 1.5; --h: 1.25"
            ></div>
            <div
              class="object-bar only-objet"
              style="--x: 5.93; --y: 6.1"
              role="toolbar"
              aria-label="Ventilateur"
            >
              <div class="object-bar-head">
                <span class="object-bar-name">Ventilateur</span>
                <button class="bar-icon" type="button" aria-label="Supprimer" title="Supprimer">
                  <svg class="icon"><use href="#i-trash-2" /></svg>
                </button>
              </div>
              <span class="seg" role="group" aria-label="Pour le joueur">
                <button type="button" aria-pressed="true">Fixe</button>
                <button type="button">À placer</button>
              </span>
              <span class="seg" role="group" aria-label="État de départ">
                <button type="button" aria-pressed="true">En marche</button>
                <button type="button">Arrêté</button>
              </span>
            </div>

            <!-- État « fil » : le fil levier → convoyeur est sélectionné. -->
            <svg class="wire-selection only-fil" viewBox="0 0 16 9" aria-hidden="true">
              <path d="M11.74 6.64 H5.74 V3.46" />
            </svg>
            <div
              class="object-bar only-fil"
              style="--x: 8.9; --y: 6.2"
              role="toolbar"
              aria-label="Fil"
            >
              <div class="object-bar-head">
                <span class="object-bar-name">Fil · Levier → Convoyeur</span>
                <button class="bar-icon" type="button" aria-label="Débrancher" title="Débrancher">
                  <svg class="icon"><use href="#i-trash-2" /></svg>
                </button>
              </div>
              <span class="seg" role="group" aria-label="Pour le joueur">
                <button type="button" aria-pressed="true">Fixe</button>
                <button type="button">À placer</button>
              </span>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>
      // ?etat=objet ou ?etat=fil montre la barre flottante correspondante.
      document.body.dataset.etat = new URLSearchParams(location.search).get('etat') ?? 'rien';
    </script>
  </body>
</html>
