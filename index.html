<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#101923" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="TinkerBolt — construisez, testez et améliorez vos machines mécaniques."
    />
    <title>TinkerBolt</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #101923;
      }
      #startup-splash {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        overflow: hidden;
        place-items: center;
        isolation: isolate;
        background: #101923;
        color: #fff8e9;
        font-family: Nunito, 'Trebuchet MS', Arial, sans-serif;
        opacity: 1;
        transition:
          opacity 220ms ease,
          visibility 220ms ease;
      }
      #startup-splash.is-leaving {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }
      #startup-splash .backdrop {
        position: absolute;
        z-index: -1;
        inset: -8%;
        display: block;
        transform: scale(1.05);
      }
      #startup-splash .backdrop img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 38%;
        filter: blur(34px) brightness(0.42) saturate(0.82);
      }
      #startup-splash .backdrop::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgb(8 16 25 / 20%), rgb(8 16 25 / 54%));
        content: '';
      }
      #startup-splash .splash-art {
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 16px 45px rgb(0 0 0 / 26%));
      }
      #startup-splash .splash-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #startup-splash .loading {
        position: absolute;
        right: 20px;
        bottom: clamp(20px, 4.2vh, 42px);
        left: 20px;
        width: min(380px, calc(100% - 40px));
        margin: auto;
      }
      /* A bolted wooden plank, like the logo's sign, with an amber fill. */
      #startup-splash .progress-track {
        position: relative;
        height: 22px;
        padding: 4px 16px;
        border: 2px solid #4a2a12;
        border-radius: 7px;
        background: linear-gradient(180deg, #b9712c, #8f5220);
        box-shadow:
          inset 0 1px 0 rgb(255 221 160 / 55%),
          0 5px 14px rgb(0 0 0 / 45%);
      }
      #startup-splash .progress-track::before,
      #startup-splash .progress-track::after {
        position: absolute;
        top: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d9dde2;
        box-shadow: inset -1px -1px 0 #6b7078;
        content: '';
        transform: translateY(-50%);
      }
      #startup-splash .progress-track::before {
        left: 5px;
      }
      #startup-splash .progress-track::after {
        right: 5px;
      }
      #startup-splash .progress-groove {
        height: 100%;
        overflow: hidden;
        border-radius: 4px;
        background: #3b210f;
        box-shadow: inset 0 2px 3px rgb(0 0 0 / 55%);
      }
      #startup-splash .progress-groove span {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(180deg, #ffe07a, #ffb52e 55%, #f08a14);
      }
      #startup-splash .credit {
        display: block;
        min-height: 14px;
        margin-top: 5px;
        color: #fff8e9;
        font-size: 11px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        text-shadow:
          0 1px 2px rgb(0 0 0 / 90%),
          0 0 8px rgb(0 0 0 / 70%);
      }
      #startup-error {
        position: fixed;
        z-index: 10001;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px;
        background: #101923;
        color: #fff8e9;
        font:
          16px/1.5 Nunito,
          'Trebuchet MS',
          Arial,
          sans-serif;
        text-align: center;
      }
      #startup-error[hidden] {
        display: none;
      }
      #startup-error h1,
      #startup-error p {
        margin: 0;
      }
      #startup-error button {
        justify-self: center;
        min-height: 44px;
        padding: 8px 18px;
        border: 0;
        border-radius: 8px;
        background: #f2a524;
        color: #101923;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      @media (max-height: 520px) {
        #startup-splash .loading {
          bottom: 14px;
        }
        #startup-splash .progress-track {
          height: 18px;
          padding-block: 3px;
        }
        #startup-splash .credit {
          margin-top: 3px;
          font-size: 10px;
          line-height: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-splash {
          transition: none;
        }
      }
    </style>
    <script>
      window.__tinkerBoltStartupModuleFailed = false;
      window.addEventListener(
        'error',
        (event) => {
          if (event.target === window || event.target instanceof HTMLScriptElement)
            window.__tinkerBoltStartupModuleFailed = true;
        },
        true,
      );
      window.addEventListener('unhandledrejection', () => {
        window.__tinkerBoltStartupModuleFailed = true;
      });
    </script>
  </head>
  <body>
    <div id="root" aria-hidden="true" inert></div>
    <div id="startup-splash" role="status" aria-label="Chargement de TinkerBolt">
      <picture class="backdrop" aria-hidden="true">
        <source
          media="(min-width: 1100px)"
          srcset="%BASE_URL%assets/splash/splash-screen-desktop.webp"
        />
        <source
          media="(min-width: 600px)"
          srcset="%BASE_URL%assets/splash/splash-screen-tablet.webp"
        />
        <img src="%BASE_URL%assets/splash/splash-screen.webp" alt="" />
      </picture>
      <picture class="splash-art">
        <source
          media="(min-width: 1100px)"
          srcset="%BASE_URL%assets/splash/splash-screen-desktop.webp"
        />
        <source
          media="(min-width: 600px)"
          srcset="%BASE_URL%assets/splash/splash-screen-tablet.webp"
        />
        <img
          src="%BASE_URL%assets/splash/splash-screen.webp"
          alt="TinkerBolt — Bolt prépare une machine dans son atelier."
        />
      </picture>
      <section class="loading" aria-label="Chargement de TinkerBolt">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Chargement"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress-groove"><span></span></div>
        </div>
        <div class="credit">Créé par Alexis Flesch</div>
      </section>
    </div>
    <div id="startup-error" role="alert" hidden>
      <h1>TinkerBolt n’a pas pu démarrer</h1>
      <p>Le chargement de l’application a échoué. Réessaie pour la relancer.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('startup-splash');
        const error = document.getElementById('startup-error');
        const root = document.getElementById('root');
        if (splash === null || error === null || root === null) return;

        const MINIMUM_MS = 1200;
        let state = 'loading';
        let minimumElapsed = false;

        // The bar follows the start-up itself: it fills with the minimum
        // display time, holds at 90 % while the application is not ready,
        // and is full when the splash leaves.
        const bar = splash.querySelector('[role="progressbar"]');
        const fill = splash.querySelector('.progress-groove span');
        const startedAt = performance.now();
        const showProgress = () => {
          if (bar === null || fill === null || !splash.isConnected) return;
          const elapsed = Math.min((performance.now() - startedAt) / MINIMUM_MS, 1);
          const progress = state === 'ready' ? elapsed : Math.min(elapsed, 1) * 0.9;
          fill.style.width = `${String(progress * 100)}%`;
          bar.setAttribute('aria-valuenow', String(Math.round(progress * 100)));
          if (progress < 1) window.requestAnimationFrame(showProgress);
        };
        showProgress();
        const reveal = () => {
          if (!minimumElapsed || state === 'loading') return;
          if (state === 'ready') {
            root.removeAttribute('aria-hidden');
            root.removeAttribute('inert');
            splash.classList.add('is-leaving');
            window.setTimeout(() => splash.remove(), 240);
          } else {
            splash.remove();
            error.hidden = false;
          }
        };
        const fail = () => {
          if (state !== 'loading') return;
          state = 'failed';
          reveal();
        };
        document.addEventListener(
          'tinkerbolt:app-ready',
          () => {
            if (state !== 'loading') return;
            state = 'ready';
            window.clearTimeout(watchdog);
            reveal();
          },
          { once: true },
        );
        document.addEventListener('tinkerbolt:app-failed', fail, { once: true });
        window.addEventListener(
          'error',
          (event) => {
            if (
              state === 'loading' &&
              (event.target === window || event.target instanceof HTMLScriptElement)
            )
              fail();
          },
          true,
        );
        window.addEventListener('unhandledrejection', () => fail());
        const watchdog = window.setTimeout(fail, 8000);
        window.setTimeout(() => {
          minimumElapsed = true;
          reveal();
        }, MINIMUM_MS);
        if (window.__tinkerBoltStartupModuleFailed === true) fail();
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
