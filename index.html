<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#101923" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="TinkerBolt — construisez, testez et améliorez vos machines mécaniques."
    />
    <title>TinkerBolt</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #101923;
      }
      #startup-splash {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        overflow: hidden;
        place-items: center;
        isolation: isolate;
        background: #101923;
        color: #fff8e9;
        font-family: Nunito, 'Trebuchet MS', Arial, sans-serif;
        opacity: 1;
        transition:
          opacity 220ms ease,
          visibility 220ms ease;
      }
      #startup-splash.is-leaving {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }
      #startup-splash .backdrop {
        position: absolute;
        z-index: -1;
        inset: -8%;
        display: block;
        transform: scale(1.05);
      }
      #startup-splash .backdrop img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 38%;
        filter: blur(34px) brightness(0.42) saturate(0.82);
      }
      #startup-splash .backdrop::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgb(8 16 25 / 20%), rgb(8 16 25 / 54%));
        content: '';
      }
      #startup-splash .splash-art {
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 16px 45px rgb(0 0 0 / 26%));
      }
      #startup-splash .splash-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #startup-splash .loading {
        position: absolute;
        right: 20px;
        bottom: clamp(20px, 4.2vh, 42px);
        left: 20px;
        width: min(380px, calc(100% - 40px));
        margin: auto;
        padding: 10px 13px 5px;
        border: 1px solid rgb(255 231 181 / 48%);
        border-radius: 12px;
        background: rgb(11 24 38 / 82%);
        box-shadow: 0 7px 24px rgb(0 0 0 / 42%);
        backdrop-filter: blur(7px);
      }
      #startup-splash .progress-track {
        height: 11px;
        overflow: hidden;
        border: 1px solid #192a3b;
        border-radius: 999px;
        background: #08121e;
        box-shadow: inset 0 2px 4px rgb(0 0 0 / 48%);
      }
      #startup-splash .progress-track span {
        display: block;
        width: 68%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f2a524, #ffd45f 65%, #fff0ab);
        box-shadow: 0 0 12px rgb(255 188 51 / 55%);
        animation: startup-progress 1.4s ease-in-out infinite alternate;
      }
      #startup-splash .credit {
        display: block;
        min-height: 14px;
        margin-top: 5px;
        color: #eee3cb;
        font-size: 11px;
        line-height: 14px;
        text-align: center;
      }
      #startup-error {
        position: fixed;
        z-index: 10001;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px;
        background: #101923;
        color: #fff8e9;
        font:
          16px/1.5 Nunito,
          'Trebuchet MS',
          Arial,
          sans-serif;
        text-align: center;
      }
      #startup-error[hidden] {
        display: none;
      }
      #startup-error h1,
      #startup-error p {
        margin: 0;
      }
      #startup-error button {
        justify-self: center;
        min-height: 44px;
        padding: 8px 18px;
        border: 0;
        border-radius: 8px;
        background: #f2a524;
        color: #101923;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      @keyframes startup-progress {
        from {
          transform: translateX(-14%);
        }
        to {
          transform: translateX(42%);
        }
      }
      @media (max-height: 520px) {
        #startup-splash .loading {
          bottom: 14px;
          padding-top: 7px;
        }
        #startup-splash .progress-track {
          height: 8px;
        }
        #startup-splash .credit {
          margin-top: 3px;
          font-size: 10px;
          line-height: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-splash,
        #startup-splash .progress-track span {
          transition: none;
          animation: none;
        }
      }
    </style>
    <script>
      window.__tinkerBoltStartupModuleFailed = false;
      window.addEventListener(
        'error',
        (event) => {
          if (event.target === window || event.target instanceof HTMLScriptElement)
            window.__tinkerBoltStartupModuleFailed = true;
        },
        true,
      );
      window.addEventListener('unhandledrejection', () => {
        window.__tinkerBoltStartupModuleFailed = true;
      });
    </script>
  </head>
  <body>
    <div id="root" aria-hidden="true" inert></div>
    <div id="startup-splash" role="status" aria-label="Chargement de TinkerBolt">
      <picture class="backdrop" aria-hidden="true">
        <source
          media="(min-width: 1100px)"
          srcset="%BASE_URL%assets/splash/splash-screen-desktop.webp"
        />
        <source
          media="(min-width: 600px)"
          srcset="%BASE_URL%assets/splash/splash-screen-tablet.webp"
        />
        <img src="%BASE_URL%assets/splash/splash-screen.webp" alt="" />
      </picture>
      <picture class="splash-art">
        <source
          media="(min-width: 1100px)"
          srcset="%BASE_URL%assets/splash/splash-screen-desktop.webp"
        />
        <source
          media="(min-width: 600px)"
          srcset="%BASE_URL%assets/splash/splash-screen-tablet.webp"
        />
        <img
          src="%BASE_URL%assets/splash/splash-screen.webp"
          alt="TinkerBolt — Bolt prépare une machine dans son atelier."
        />
      </picture>
      <section class="loading" aria-label="Chargement de TinkerBolt">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Chargement"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <span></span>
        </div>
        <div class="credit">Créé par Alexis Flesch</div>
      </section>
    </div>
    <div id="startup-error" role="alert" hidden>
      <h1>TinkerBolt n’a pas pu démarrer</h1>
      <p>Le chargement de l’application a échoué. Réessaie pour la relancer.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('startup-splash');
        const error = document.getElementById('startup-error');
        const root = document.getElementById('root');
        if (splash === null || error === null || root === null) return;

        let state = 'loading';
        let minimumElapsed = false;
        const reveal = () => {
          if (!minimumElapsed || state === 'loading') return;
          if (state === 'ready') {
            root.removeAttribute('aria-hidden');
            root.removeAttribute('inert');
            splash.classList.add('is-leaving');
            window.setTimeout(() => splash.remove(), 240);
          } else {
            splash.remove();
            error.hidden = false;
          }
        };
        const fail = () => {
          if (state !== 'loading') return;
          state = 'failed';
          reveal();
        };
        document.addEventListener(
          'tinkerbolt:app-ready',
          () => {
            if (state !== 'loading') return;
            state = 'ready';
            window.clearTimeout(watchdog);
            reveal();
          },
          { once: true },
        );
        document.addEventListener('tinkerbolt:app-failed', fail, { once: true });
        window.addEventListener(
          'error',
          (event) => {
            if (
              state === 'loading' &&
              (event.target === window || event.target instanceof HTMLScriptElement)
            )
              fail();
          },
          true,
        );
        window.addEventListener('unhandledrejection', () => fail());
        const watchdog = window.setTimeout(fail, 8000);
        window.setTimeout(() => {
          minimumElapsed = true;
          reveal();
        }, 1200);
        if (window.__tinkerBoltStartupModuleFailed === true) fail();
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
